# Latin roster and pursuits (latin.py): every morning, look up each artist on Ticketmaster and
# rebuild latin/ (the page, feed.json for the ChatGPT report, feed.txt), then sweep every Latin show
# in NY, LA and Miami and rebuild index.html (shows.py). No Claude, no browser.
#
# To change the list: Actions tab > "Latin roster" > Run workflow > pick an action, type a name.
# The list is data/latin.json, in plain text.
#
# Secret: TICKETMASTER_API_KEY.
name: Latin roster

on:
  schedule:
    - cron: "30 12 * * *"   # 7:30 AM New York (standard time), 8:30 in summer
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        default: refresh only
        options:
          - refresh only
          - add pursuit
          - add to roster
          - sign (pursuit becomes roster)
          - remove
          - fix Ticketmaster match
      name:
        description: Artist name (as Ticketmaster spells it, if you can)
        required: false
      tm_id:
        description: "Optional Ticketmaster attraction id (K8vZ...), or 'none' if they are not on Ticketmaster, or 'auto' to search again"
        required: false

permissions:
  contents: write

concurrency:
  group: latin
  cancel-in-progress: false

jobs:
  latin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Change the list
        if: github.event_name == 'workflow_dispatch' && inputs.action != 'refresh only'
        env:
          ACTION: ${{ inputs.action }}
          NAME: ${{ inputs.name }}
          TM_ID: ${{ inputs.tm_id }}
        run: |
          [ -n "$NAME" ] || { echo "::error::Type an artist name"; exit 1; }
          case "$ACTION" in
            "add pursuit")      python latin.py add "$NAME" ${TM_ID:+--tm "$TM_ID"} ;;
            "add to roster")    python latin.py add "$NAME" --roster ${TM_ID:+--tm "$TM_ID"} ;;
            "sign (pursuit becomes roster)") python latin.py sign "$NAME" ;;
            "remove")           python latin.py remove "$NAME" ;;
            "fix Ticketmaster match")
              [ -n "$TM_ID" ] || { echo "::error::Give the Ticketmaster id, 'none' or 'auto'"; exit 1; }
              python latin.py pin "$NAME" "$TM_ID" ;;
          esac

      - name: Look up shows and rebuild
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          TZ: America/New_York
        run: python latin.py

      - name: All Latin shows (the main page)
        if: github.event_name == 'schedule' || inputs.action == 'refresh only'
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          TZ: America/New_York
        run: python shows.py

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898583+github-actions[bot]@users.noreply.github.com"
          git add data/latin.json data/latin_seen.json latin/ index.html shows.json data/shows_seen.json
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -q -m "Latin roster: ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'daily refresh' }}"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && exit 0; sleep 5; done
          echo "::error::push failed"; exit 1
